name: 功能建议
description: 建议新的文件面板能力或交互改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户场景，而不只是期望的实现。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: impact
    attributes:
      label: 兼容性与安全影响
      description: 是否影响文件访问、Git、终端、依赖、配置或现有布局？

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同建议。
          required: true
        - label: 该建议符合“DSH Web UI 的 Codex 风格文件侧栏”项目范围。
          required: true
